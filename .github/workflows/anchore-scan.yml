name: anchore-scan
on:
    push:
        branches: [master, main]
    pull_request:
        branches: [master, main]        
    workflow_dispatch:

permissions:
    contents: read

jobs:
    scan-filesystem:
        name: Grype filesystem scan
        runs-on: ubuntu-latest
        permissions:
            contents: read
            security-events: write
        steps:
            - uses: actions/checkout@v4
            - name: Scan source (composer.lock etc.)
              id: scan
              uses: anchore/scan-action@v7
              with:
                  path: "."
                  fail-build: false
                  severity-cutoff: high
                  output-format: sarif
            - name: Upload SARIF
              uses: github/codeql-action/upload-sarif@v3
              with:
                  sarif_file: ${{ steps.scan.outputs.sarif }}
                  category: grype-filesystem

    scan-image:
        name: Grype container image scan
        runs-on: ubuntu-latest
        permissions:
            contents: read
            security-events: write
        steps:
            - uses: actions/checkout@v4
            # The Dockerfile's apt step no longer builds (Debian 11 mirrors 404),
            # so scan its base image, which carries the PHP runtime and OS packages.
            - name: Resolve base image from Dockerfile
              id: base
              run: echo "image=$(awk 'toupper($1)=="FROM"{print $2; exit}' Dockerfile)" >> "$GITHUB_OUTPUT"
            - name: Scan image (php runtime + OS packages)
              id: scan
              uses: anchore/scan-action@v7
              with:
                  image: ${{ steps.base.outputs.image }}
                  fail-build: false
                  severity-cutoff: high
                  output-format: sarif
            - name: Upload SARIF
              uses: github/codeql-action/upload-sarif@v3
              with:
                  sarif_file: ${{ steps.scan.outputs.sarif }}
                  category: grype-image
