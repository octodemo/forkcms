name: anchore-scan
on:
    push:
        branches: [master, main]
    workflow_dispatch:

permissions:
    contents: read

jobs:
    scan-filesystem:
        name: Grype filesystem scan
        runs-on: ubuntu-latest
        permissions:
            contents: read
            security-events: write
        steps:
            - uses: actions/checkout@v4
            - name: Scan source (composer.lock etc.)
              id: scan
              uses: anchore/scan-action@v7
              with:
                  path: "."
                  fail-build: false
                  severity-cutoff: high
                  output-format: sarif
            - name: Upload SARIF
              uses: github/codeql-action/upload-sarif@v3
              with:
                  sarif_file: ${{ steps.scan.outputs.sarif }}
                  category: grype-filesystem

    scan-image:
        name: Grype container image scan
        runs-on: ubuntu-latest
        permissions:
            contents: read
            security-events: write
        steps:
            - uses: actions/checkout@v4
            - name: Build image
              run: docker build -t forkcms:scan .
            - name: Scan image (php runtime + OS packages)
              id: scan
              uses: anchore/scan-action@v7
              with:
                  image: forkcms:scan
                  fail-build: false
                  severity-cutoff: high
                  output-format: sarif
            - name: Upload SARIF
              uses: github/codeql-action/upload-sarif@v3
              with:
                  sarif_file: ${{ steps.scan.outputs.sarif }}
                  category: grype-image
